apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend1
  namespace: reverseproxy-demo
  labels:
    app.kubernetes.io/name: backend1
    app.kubernetes.io/part-of: reverseproxy-demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 300
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend1
        app.kubernetes.io/part-of: reverseproxy-demo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend1
          image: reverseproxy-backend1:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend1
  namespace: reverseproxy-demo
  labels:
    app.kubernetes.io/name: backend1
    app.kubernetes.io/part-of: reverseproxy-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend1
  ports:
    - name: http
      port: 8080
      targetPort: http
