x-runtime: &runtime
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 512m
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 4 http://127.0.0.1:$$PORT/health || exit 1"]
    interval: 10s
    timeout: 5s
    start_period: 60s
    retries: 6

services:
  proxy:
    <<: *runtime
    build:
      context: ./loadbalancerReverse
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      SERVER_ADDRESS: "0.0.0.0"
      BACKEND_1_URL: http://backend1:8080
      BACKEND_2_URL: http://backend2:8080
      BACKEND_3_URL: http://backend3:8080
      UPSTREAM_TIMEOUT_MS: "${UPSTREAM_TIMEOUT_MS:-90000}"
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:8080"
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy

  backend1:
    <<: *runtime
    build:
      context: ./loadbalancer-demo/server1
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      SERVER_ADDRESS: "0.0.0.0"

  backend2:
    <<: *runtime
    build:
      context: ./loadbalancer-demo/server2
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      SERVER_ADDRESS: "0.0.0.0"

  backend3:
    <<: *runtime
    build:
      context: ./loadbalancer-demo/server3
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      SERVER_ADDRESS: "0.0.0.0"
