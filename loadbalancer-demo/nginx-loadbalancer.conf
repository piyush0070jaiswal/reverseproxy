# Simple round-robin load balancer config for Nginx
# Copy this into /etc/nginx/conf.d/loadbalancer.conf (or include it in nginx.conf)
# then run: sudo nginx -s reload

upstream backend_servers {
    # default strategy = round robin
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
    server 127.0.0.1:8083;

    # other strategies you can try instead of round robin:
    # least_conn;                  -> sends traffic to the server with fewest active connections
    # ip_hash;                     -> same client always hits the same backend (sticky sessions)
}

server {
    listen 8080;

    location / {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
